name: Update Homebrew Tap
on:
  release:
    types: [published]
jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Get release info
        id: release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download tarball and compute SHA256
        id: sha
        run: |
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.release.outputs.tag }}.tar.gz"
          SHA=$(curl -sL "$URL" | shasum -a 256 | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/mihornak/homebrew-imggen.git" tap
          cd tap

          cat > Formula/imggen.rb <<'FORMULA'
          class Imggen < Formula
            desc "Generate images using AI providers (Gemini, Freepik)"
            homepage "https://github.com/mihornak/imggen"
            url "${{ steps.sha.outputs.url }}"
            sha256 "${{ steps.sha.outputs.sha256 }}"
            license "MIT"

            depends_on "python@3"

            def install
              bin.install "imggen"
            end

            def caveats
              <<~EOS
                To configure API keys, run:
                  imggen auth

                To install the Claude Code skill (/generate-image), run:
                  imggen setup-skill
              EOS
            end

            test do
              assert_match "Available models", shell_output("#{bin}/imggen --list-models")
            end
          end
          FORMULA

          # Fix indentation (heredoc adds leading spaces)
          sed -i 's/^          //' Formula/imggen.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/imggen.rb
          git commit -m "Update imggen to ${{ steps.release.outputs.version }}"
          git push
