name: Publish to PyPI
on:
  release:
    types: [published]
permissions:
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify imggen_cli.py is in sync
        run: |
          tail -n +2 imggen > /tmp/expected.py
          diff -u /tmp/expected.py imggen_cli.py || {
            echo "ERROR: imggen_cli.py is out of sync. Run 'make sync' and commit."
            exit 1
          }

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
